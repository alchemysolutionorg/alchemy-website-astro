services:
  web:
    build:
      context: ..
      dockerfile: _deployment/Dockerfile
      args:
        SANITY_PROJECT_ID: ${SANITY_PROJECT_ID}
        SANITY_DATASET: ${SANITY_DATASET}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    environment:
      - DOMAIN=${DOMAIN}
    depends_on:
      certbot:
        condition: service_completed_successfully
    restart: unless-stopped
    env_file:
      - ../.env

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot certonly --webroot --webroot-path=/var/www/certbot -d $DOMAIN --email $EMAIL --agree-tos --no-eff-email --keep-until-expiring ${CERTBOT_STAGING:-}; sleep 12h & wait $${!}; done'"
    env_file:
      - ../.env

volumes:
  certbot-certs:
  certbot-webroot: