services:
  web:
    build:
      context: ..
      dockerfile: _deployment/Dockerfile.staging
      args:
        SANITY_PROJECT_ID: ${SANITY_PROJECT_ID:-}
        SANITY_DATASET: ${SANITY_DATASET:-production}
    expose:
      - "80"
    networks:
      - backend
    deploy:
      replicas: 3
    restart: unless-stopped

  nginx-lb:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/staging-nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge